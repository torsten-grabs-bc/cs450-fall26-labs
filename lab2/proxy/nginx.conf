# CS 450 Lab 2 -- load balancer in front of the three nodes.
#
# Lab 1 put the upstream in a variable so that nginx would re-resolve it on
# every request, because `kvnode` was one Compose service name standing for an
# unknown number of replicas. Lab 2 does not have that problem: there are three
# services with three fixed names, so a plain upstream block is enough and the
# names resolve once at startup.
#
# What is worth noticing is that the proxy still spreads requests across the
# three with no idea which of them has your data. In Lab 1 that is why a GET
# came back 404 half the time. In Lab 2 it stops mattering -- not because the
# proxy got smarter, but because the nodes agree. That is the whole lab, seen
# from out here.

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    upstream kvnodes {
        server kvnode1:8080 max_fails=0;
        server kvnode2:8080 max_fails=0;
        server kvnode3:8080 max_fails=0;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://kvnodes;

            proxy_set_header Host            $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout    5s;

            # A node that is stopped on purpose, as in the CP5 demo, should not
            # take the whole proxy down with it: try the next one instead.
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
