# CS 450 Lab 0 -- load balancer in front of the kvnode replicas.
#
# The interesting line is the resolver. Docker runs an embedded DNS server at
# 127.0.0.11 which resolves a Compose service name to the addresses of ALL of
# its running replicas. But nginx resolves an upstream host exactly once, at
# startup, unless the address is held in a variable -- so with a hard-coded
# upstream you would talk to whichever single replica existed when nginx booted,
# and scaling up later would change nothing.
#
# Putting the address in $backend forces nginx to re-resolve per request, which
# is what makes `--scale kvnode=3` visible from outside. You are looking at a
# naming problem, and you will meet it again formally in Chapter 5.

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen 8080;

        resolver 127.0.0.11 valid=1s ipv6=off;

        location / {
            set $backend "kvnode:8080";
            proxy_pass http://$backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout    5s;
        }
    }
}
