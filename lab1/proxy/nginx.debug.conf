# CS 450 Lab 1 -- the proxy configuration used ONLY while debugging.
#
# Identical to nginx.conf except for the timeouts at the bottom. Read that file
# for the explanation of the resolver and why the upstream lives in a variable.
#
# nginx.conf gives kvnode five seconds to answer. That is deliberate: a request
# that takes longer than that in normal operation is a bug, and validate.sh and
# bench.sh both rely on it. But while you are stopped on a breakpoint, kvnode
# answers nobody, so nginx gives up and hands curl a 504 Gateway Time-out --
# which looks like your handler returned something when it had not run yet.
#
# This copy waits an hour instead. It is loaded only when you ask for it:
#
#     docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d
#
# Plain `docker compose up` never sees this file, so validation and benchmarking
# keep the five-second timeout. See DEBUGGING.md.

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen 8080;

        resolver 127.0.0.11 valid=1s ipv6=off;

        location / {
            set $backend "kvnode:8080";
            proxy_pass http://$backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
        }
    }
}
